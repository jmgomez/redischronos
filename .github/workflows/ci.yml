name: CI

on:
  push:
    branches: [devel]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        nim: ["2.2.0", "2.2.10"]
        mm: [refc, orc]
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}

      - name: Verify pinned toolchain
        run: |
          nim --version
          nimble --version

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Configure password and ACL authentication
        run: |
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass audit-password
          docker exec "${{ job.services.redis.id }}" redis-cli -a audit-password ACL SETUSER audituser on '>acl-password' '~*' '&*' '+@all'

      - name: Run password-authenticated memory and Redis contracts
        env:
          REDIS_TEST_CONTAINER: ${{ job.services.redis.id }}
          REDIS_TEST_URL: redis://:audit-password@127.0.0.1:6379/15
        run: nim c --mm:${{ matrix.mm }} --path:src -d:test -d:redisIntegration -r tests/tall.nim

      - name: Run ACL-authenticated memory and Redis contracts
        env:
          REDIS_TEST_CONTAINER: ${{ job.services.redis.id }}
          REDIS_TEST_URL: redis://audituser:acl-password@127.0.0.1:6379/15
        run: nim c --mm:${{ matrix.mm }} --path:src -d:test -d:redisIntegration -r tests/tall.nim

      - name: Prove configuration-only backend switching
        env:
          REDISCHRONOS_URL: redis://audituser:acl-password@127.0.0.1:6379/15
        run: |
          nim c --mm:${{ matrix.mm }} --path:src -o:/tmp/redischronos-backendswitch examples/backendswitch.nim
          REDISCHRONOS_URL=mem:// /tmp/redischronos-backendswitch > /tmp/redischronos-memory.out
          /tmp/redischronos-backendswitch > /tmp/redischronos-redis.out
          diff -u /tmp/redischronos-memory.out /tmp/redischronos-redis.out

      - name: Verify Redis was restored by the outage contract
        run: timeout 30s sh -c 'until docker exec "${{ job.services.redis.id }}" redis-cli -a audit-password ping 2>/dev/null | grep -q PONG; do sleep 1; done'
